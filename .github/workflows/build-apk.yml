name: Build APK Calculator

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Calculator APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext

      - name: Create virtual environment
        run: |
              python3.10 -m venv venv
              ./venv/bin/python --version
              ./venv/bin/python -m pip install --upgrade pip
              ./venv/bin/python -m pip install buildozer
              ./venv/bin/python -m pip install "cython==0.29.34"

      - name: Build APK
        run: |
           export PATH="$GITHUB_WORKSPACE/venv/bin:$PATH"
            ./venv/bin/cython --version
            ./venv/bin/python -m buildozer android debug
             
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kalkulator-apk
          path: bin/*.apk
